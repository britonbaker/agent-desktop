<!doctype html>
<meta charset="utf-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>Rove — desktop drive</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#05070b; --panel:#0b1018; --line:#1a2130; --ink:#e6ecf6; --ink-2:#76859f;
    --ok:#7ef0d0; --warn:#e0a45f; --bad:#d2706a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }
  body { display:grid; grid-template-rows:auto auto 1fr auto; }

  header { display:flex; gap:10px; align-items:center; padding:12px 16px;
    border-bottom:1px solid var(--line); }
  .brand { letter-spacing:.14em; color:var(--ink-2); }
  .sp { flex:1; }
  button { background:var(--panel); border:1px solid var(--line); color:var(--ink-2);
    padding:7px 12px; border-radius:7px; font:inherit; cursor:pointer; }
  button:hover { color:var(--ink); }
  button.on { color:#05070b; background:var(--ok); border-color:transparent; }

  .perm { padding:8px 16px; border-bottom:1px solid var(--line); color:var(--ink-2); font-size:11.5px; }
  .perm.bad { color:var(--warn); }
  #mic { border-top:1px solid #10161f; font-variant-numeric:tabular-nums; }
  #mic b { color:var(--ink); font-weight:400; }
  #mic .lvl { color:var(--ok); }

  .log { overflow:auto; padding:12px 16px; display:grid; gap:9px; align-content:start; }
  .ev { border-left:2px solid var(--line); padding-left:10px; color:var(--ink-2); }
  .ev.act { border-color:var(--ok); } .ev.ign { border-color:#232c3c; opacity:.6; }
  .ev.ask { border-color:var(--warn); } .ev.err { border-color:var(--bad); color:var(--bad); }
  .ev.ans { border-color:#3d7fd6; }
  .ev .say { color:var(--ink); white-space:pre-wrap; margin-top:3px; }
  .ev .src { font-size:10px; opacity:.55; margin-top:3px; }
  .ev b { color:var(--ink); font-weight:400; }
  .ev .n { font-variant-numeric:tabular-nums; font-size:11px; }
  .ev .go { margin-top:5px; display:flex; gap:6px; }
  .ev .go button { padding:3px 10px; font-size:11px; }

  footer { padding:9px 16px; border-top:1px solid var(--line); color:#3c4a60;
    display:flex; gap:12px; flex-wrap:wrap; }
  .err { color:var(--bad); }

  .fbody { position:relative; }
  .float { position:fixed; right:16px; top:104px; z-index:50; width:180px; background:#04060a;
    border:1px solid var(--line); border-radius:12px; overflow:hidden; user-select:none;
    touch-action:none; box-shadow:0 10px 34px rgba(0,0,0,.6); }
  .float .grip { display:flex; align-items:center; gap:6px; padding:5px 8px;
    border-bottom:1px solid var(--line); cursor:grab; color:#3c4a60; font-size:10px;
    letter-spacing:.12em; }
  .float.dragging .grip { cursor:grabbing; }
  .float .grip .s { flex:1; }
  .float .grip button { padding:2px 7px; font-size:10px; }
  .fbody { display:flex; flex-direction:column; min-height:0; }
  #face { display:block; width:100%; height:206px; flex:1 1 auto; min-height:0; }
  .saywrap { display:flex; align-items:center; }
  #sayclose { display:none; }
  #say { flex:0 0 auto; width:100%; background:#090f18; border:0;
    border-top:1px solid #141b27; color:var(--ink); padding:10px 13px; border-radius:0;
    font:500 14px/1.3 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    letter-spacing:-.005em; transition:background .15s; }
  #say::placeholder { color:#4a5a73; font-weight:450; }
  #say:focus { outline:none; background:#0d1520; }
  body.pip-host .float { display:none; }
  /* In the desktop app the window IS the face: the console chrome goes away and the
     panel fills it. Same page either way, no second copy to keep in sync.
     This block is last on purpose — at equal specificity CSS takes the later rule, and
     sitting above .float meant none of these overrides actually applied. */
  /* This is the app's layout, not a narrow-screen layout, and the difference
     mattered the moment his window could be dragged: as a breakpoint it turned him
     into the development page mid-drag at 520 points. The class is set from the one
     thing that actually decides it — whether there is a Tauri to be running in —
     and falls back to the width in a browser, where the width is all there is. */
  html.app {
    /* He is one design at one size, scaled — not a layout that reflows. His panel
       was already a fraction of the window (100vw * 1.10); --s says the same thing
       for everything that was written in points back when the window was always 202
       of them. Drag him wider and the buttons, the text and the corner radius grow
       with his face instead of staying behind as a row of specks.

       --s is a length — one design point — so the multipliers are bare numbers, not
       pixels. `44px * var(--s)` is a length times a length, which is not a thing,
       and every rule written that way silently collapsed to zero. */
    /* One panel's width. The window is two of them when a card is open beside
       him, and every measurement below is his panel's, not the window's. */
    --pw: 100vw;
    --s: calc(var(--pw) / 202);

    /* The material everything he says is made of.
       Three layers, because one translucent fill is a translucent fill and not
       glass: a fill that is lighter at the top than the bottom, a half-pixel of
       white along the top edge where a pane would catch the light, and a shadow
       underneath so it sits above the thing it covers rather than in it.
       No backdrop-filter, and not for want of trying. It cannot reach his face —
       that is the Metal layer, underneath the whole webview — and over the
       transparent parts of the window it draws a second rounded rectangle just
       inside the first: WebKit clips the filtered backdrop to its own rounded rect
       and composites it separately, and the seam shows. Something that has nothing
       to blur and leaves a ring behind is all cost. The fill carries the look. */
    /* The band above him. He used to say things across his own face, which is
       the one part of this that is supposed to be readable at a glance. */
    /* Tall enough that a four-line answer still has air above it. A bubble that
       fills its band to the edges is a header bar, whatever shape it is. */
    --head: calc(var(--pw) * 0.55);
  /* Where the bar and the text field sit: under his panel by default, and on it
     when he is two circles with a readout below. */
  --bar: calc(var(--head) + var(--ph) + 10 * var(--s));
    /* His panel's height. A rounded rectangle wants room for a whole face; two
       circles want room for two eyes and the brows above them, and everything that
       sits under him has to come up with it. */
    --ph: calc(var(--pw) * 1.10);

    --glass: linear-gradient(rgba(78,83,96,.80), rgba(30,33,42,.88));
    --glass-edge: inset 0 calc(0.6 * var(--s)) 0 rgba(255,255,255,.22),
                  inset 0 0 0 calc(0.6 * var(--s)) rgba(255,255,255,.075);
    --glass-lift: 0 calc(2 * var(--s)) calc(12 * var(--s)) rgba(0,0,0,.42);

    /* Everything above the Metal layer has to be genuinely see-through, not merely
       dark. .float carried an opaque background and was covering the whole face. */
    &, & body { background:transparent !important; }
    .float { background:transparent !important; }
    .fbody { background:transparent !important; }
    body { display:flex; flex-direction:column; grid-template-rows:none; }
    header, footer, .float .grip { display: none; }

    /* The log was display:none here, which meant every answer he gave — every
       forecast, every PR list, every "I don't have a tool for that" — was written
       into a hidden element. The tools worked and were invisible, which is
       indistinguishable from not working.

       It is not the console list here though: one answer, over him, fading out. */
    .log { display: block; position: static; padding: 0; gap: 0;
      margin: calc(52 * var(--s)) calc(10 * var(--s)) 0;
      overflow: hidden; flex: 0 1 auto; min-height: 0; z-index: 20; }
    .log .ev { display: none; }
    .log .ev:first-child { display: block; border: 0;
      padding: calc(11 * var(--s)) calc(14 * var(--s));
      border-radius: calc(18 * var(--s));
      background: var(--glass);
      box-shadow: var(--glass-lift), var(--glass-edge);
      color: var(--ink); font-size: calc(11.5 * var(--s)); line-height: 1.45;
      animation: pop .18s ease-out; }
    .log .ev.ign:first-child { display: none; }   /* chatter stays silent */
    .log .ev .n { display: none; }                /* diagnostics belong in the browser */
    /* Scaled like everything else in here. Left out, it was the one line on him
       still being drawn at its browser size, and it looked like a mistake. */
    .log .ev .src { font-size: calc(9.5 * var(--s)); }
    .log .ev .say { font-size: calc(11.5 * var(--s)); }
    .log .ev { cursor: default; }
    .log .ev:first-child { cursor: pointer; }   /* click it to send it away */
    /* He occupies the top of the window; the strip below him is transparent, so the
       buttons read as floating under the panel rather than sitting on his chin. */
    /* He is a square-ish panel at the top, and the rest of the window is empty
       transparent space for anything that has something to say. Nothing is allowed
       to cover his face — a message sitting on top of it hides the one part of this
       that is supposed to be readable at a glance. */
    /* Reserved rather than grown into on demand: the window is transparent up
       here, so the room costs nothing but a resize on every sentence would be a
       window jumping about while you read it. */
    .think { flex:0 0 auto; height:var(--head); position:relative;
      display:flex; align-items:flex-end; justify-content:center;
      padding:calc(7 * var(--s)) calc(7 * var(--s)) calc(9 * var(--s));
      pointer-events:none; }
    /* No overflow:hidden — it clips the element's own pseudo-elements, and the
       tail is two of those. Long answers are clamped by line instead. */
    .think .bub { max-width:100%; pointer-events:auto; cursor:pointer;
      display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4;
      padding:calc(9 * var(--s)) calc(12 * var(--s));
      border-radius:calc(16 * var(--s));
      /* Flat. The bubble and the text field are things to read, and a gradient
         under a lit top edge is a surface competing with its own contents. The
         grey is the buttons', so the three of them are one family. */
      background:#2a2a2d;
      color:var(--ink); font-size:calc(11.5 * var(--s)); line-height:1.4;
      opacity:0; transform:translateY(calc(4 * var(--s))); transition:opacity .2s,
      transform .2s; }
    .think.on .bub { opacity:1; transform:none; }
    .think .bub .src { display:block; margin-top:calc(3 * var(--s));
      font-size:calc(9.5 * var(--s)); opacity:.55; }
    /* The two dots are the whole reason it reads as a thought and not a banner.
       They hang off the band rather than off the bubble, and at half a *panel*
       rather than half the window — with a card open beside him the bubble is
       centred over both of them, and a tail pointing at the gap between him and
       his own weather report points at nobody. */
    .think::after, .think::before { content:''; position:absolute; border-radius:50%;
      left:calc(var(--pw) / 2); background:#2a2a2d;
      opacity:0; transition:opacity .2s; }
    .think::after { width:calc(6 * var(--s)); height:calc(6 * var(--s));
      bottom:calc(3 * var(--s)); margin-left:calc(-11 * var(--s)); }
    .think::before { width:calc(3.5 * var(--s)); height:calc(3.5 * var(--s));
      bottom:calc(-2 * var(--s)); margin-left:calc(-3 * var(--s)); }
    .think.on::after, .think.on::before { opacity:1; }
    /* The console list is the browser's. Up here there is one thing at a time. */
    .log { display:none !important; }

    /* `right` as well as `left`. The base rule pins him 16px off the right edge
       of the browser window, and a relatively positioned box with `right:16px`
       shifts *left* by 16 — so his panel has been a sixteenth of a window left of
       where it should be this whole time, which looked like a margin on one side
       and nothing on the other. */
    .float { position:relative !important; left:auto !important; right:auto !important;
      top:auto !important;
      width:var(--pw) !important; height:var(--ph); flex:0 0 auto;
      border:0; border-radius:calc(30 * var(--s)); overflow:hidden; box-shadow:none; }
    #face { border-radius:calc(30 * var(--s)); height:100%; }
    /* He is a thing you pick up and put somewhere, so he says so on approach.
       :active is the whole window's, which is close enough: there is nothing else
       in here to press. */
    .fbody { cursor:grab; }
    .fbody:active { cursor:grabbing; }

    /* A second panel of the same size, to his right. Drawn on his own lattice by
       the page rather than by the shader: the shader has one face in it, and this
       is not a face. */
    /* `&`, not `html.app.card`: these are nested inside html.app, and a nested
       selector is a descendant of its parent — `html.app html.app.card` matches
       nothing at all, and does so silently. */
    &.card { --pw: 50vw; }
    /* Two circles over his eyes and nothing between them. His panel does not need
       to be a face tall any more, so it is not. */
    /* Taller than the eyes need: the readout strip sits under them and is part of
       the same screen, so the panel has to reach it. */
    /* Tall enough for all three of him: the brows, the circles, and the strip that
       reads out under the bar. */
    &.eyes { --ph: calc(var(--pw) * 1.60);
      }
    #card { display:none; position:fixed; left:var(--pw); top:var(--head);
      width:var(--pw); height:var(--ph);
      border-radius:calc(30 * var(--s)); z-index:4; }
    &.card #card { display:block; }
    .fbody { height:100%; }
    /* #say is positioned in the second app-mode block below, not here. Two
       blocks share this breakpoint and the later one wins per property, which has
       quietly resurrected dead rules three times now. */
    /* mic diagnostics matter most here — the app's permission is separate from the
       browser's. Always up when something is wrong, on hover otherwise. */
    .perm { display:none; }
    /* It used to be a full-width bar pinned to the top, with square corners
       hanging over his rounded ones. It is a message, so it looks like one: a
       floating pill, inset, as wide as what it has to say. */
    /* fixed, not absolute: it is a sibling of his panel, not a child of it, so
       "absolute" was resolving against the page and only looked right by accident. */
    #mic { display:block; position:fixed; z-index:5;
      left:50%; transform:translateX(-50%); top:calc(9 * var(--s));
      width:max-content; max-width:82%; text-align:center;
      border:0; border-radius:calc(11 * var(--s));
      padding:calc(5 * var(--s)) calc(11 * var(--s));
      font-size:calc(10.5 * var(--s)); color:#eaeef6;
      background:var(--glass);
      box-shadow:var(--glass-lift), var(--glass-edge);
      opacity:0; pointer-events:none; transition:opacity .16s; }
    /* `.float:hover #mic` never matched — #mic is his panel's sibling, not its
       child — so in two months of hovering him this has only ever appeared when
       something was already wrong. Same trigger as the buttons now. */
    body:hover #mic, body.near #mic, #mic.bad { opacity:1; }
    /* They share the band, and only one of them is ever the point. A thought wins
       over a status line — unless the status is that something is broken. */
    .think.on ~ #mic:not(.bad) { opacity:0 !important; }
  }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } }

  /* Approach reveals, click commits — the pill appears when the pointer is near him,
     and the text box only after you ask for it. Idle, he is just a face. */
  html.app {
    /* Just under him. These were pinned to the bottom of the window, which was fine
       when he filled it and left them stranded a hundred-odd pixels below his chin
       once he became a fixed-height panel with space underneath. */
    /* It shrinks instead of hiding. Fading to nothing means there is no answer to
       "is there anything down there" until you happen to move the mouse over him;
       a small capsule is always there to aim at, and hovering inflates it into the
       bar. Width and height animate on the same curve so it reads as one object
       growing rather than two things swapping. */
    .pill { display:flex; position:fixed; left:50%; bottom:auto;
      top:var(--bar);
      transform:translateX(-50%);
      align-items:center; border-radius:99px;
      width:calc(40 * var(--s)); height:calc(14 * var(--s)); overflow:hidden;
      justify-content:center; gap:calc(4 * var(--s)); padding:calc(5 * var(--s));
      /* Solid, not translucent. There was no border to remove — the ring was the
         edge of a backdrop-blurred panel, which reads as a hairline outline against
         anything darker than it. An opaque fill has no such edge. */
      /* Neutral grey, not his blue: this is chrome sitting near him, not part
         of the thing he is made of. */
      background:#2a2a2d; border:0;
      opacity:.6; pointer-events:auto;
      transition:width .24s cubic-bezier(.2,.85,.25,1),
                 height .24s cubic-bezier(.2,.85,.25,1),
                 opacity .18s, background .18s; }
    /* .near comes from Rust, which watches the pointer whether or not the app is
       active and can see it before it arrives. :hover stays in for a plain browser,
       where there is nothing to send it — and is shut off in the app, where it is
       worse than useless: an inactive window is never told the pointer left, so a
       stray mouse event sticks :hover on and the bar never shuts again. */
    /* 36 + 4 + 36 of buttons and gap, plus the 5 of padding on each side — and
       nothing over. At 92 there were six spare units spread across the two ends,
       so the outer button had half again as much room beside it as it had above
       and below, and the capsule read as loose at both ends. */
    body:not(.native):hover .pill, body.near .pill {
      width:calc(86 * var(--s)); height:calc(46 * var(--s)); opacity:1; }
    body.typing .pill { opacity:0 !important; pointer-events:none !important; }
    /* Talking opens it the same amount hovering does, so it is one shape doing one
       thing rather than the bar and the mouth being two different sizes of the
       same object. */
    body.talking .pill { width:calc(86 * var(--s)); height:calc(46 * var(--s));
      opacity:1; }
    body.talking .pill button { opacity:0; pointer-events:none; }
    .mouth { position:absolute; inset:calc(5 * var(--s)); opacity:0;
      pointer-events:none; transition:opacity .16s;
      /* The light his band is lit with, not the grey the icons are. The capsule is
         chrome; what is playing inside it is him. */
      color:hsl(205 52% 86%); }
    .mouth svg { display:block; width:100%; height:100%; }
    /* Over the buttons the shader draws, and invisible. 92 and 92 +- 46 in mask
       units, 312 down, half extents 19 by 15 — the shader's own numbers, times the
       0.004486 of a panel width that one mask unit is at this zoom. */
    /* `&`, not `html.app.eyes`. These rules are nested inside html.app, where a
       selector written out in full becomes a *descendant* of it — html.app inside
       html.app — and matches nothing at all. */
    .keys { display:none; }
    &.eyes .keys { display:block; }
    /* Above his panel, which sits at 50. At 24 they were laid out in exactly the
       right place and every click went through them into the canvas behind. */
    .keys button { position:fixed; appearance:none; background:none; border:0;
      padding:0; cursor:pointer; z-index:60;
      width:calc(0.170 * var(--pw)); height:calc(0.134 * var(--pw));
      top:calc(var(--head) + 1.366 * var(--pw)); border-radius:calc(7 * var(--s)); }
    #key1 { left:calc(0.209 * var(--pw)); }
    #key2 { left:calc(0.415 * var(--pw)); }
    #key3 { left:calc(0.622 * var(--pw)); }
    body.talking .mouth { opacity:1; transition:opacity .2s .04s; }
    /* The contents are not squeezed into the capsule, they are simply not there
       yet: at 12px tall the icons would be clipped to a sliver on the way out. */
    .pill button svg { opacity:0; transition:opacity .14s .02s; }
    body:not(.native):hover .pill button svg,
    body.near .pill button svg { opacity:1;
      transition:opacity .16s .08s; }
    body:not(.native):hover .pill button::before,
    body.near .pill button::before { opacity:1; }
    /* Round, and sized rather than stretched. Two circles are already two
       separate shapes, so the divider that used to sit between them was a line
       drawn for its own sake. */
    .pill button { position:relative; flex:0 0 auto; background:none; border:0;
      width:calc(36 * var(--s)); height:calc(36 * var(--s));
      color:#9b9ba1; padding:0; border-radius:50%; display:flex;
      align-items:center; justify-content:center; cursor:pointer;
      transition:color .12s, opacity .16s; }
    /* The hover state is its own rounded shape, inset from the button's edges, so
       there is a little of the pill left visible all the way around it. Filling the
       half edge to edge made it read as two panels; leaving a gap makes it read as
       one control with something highlighted inside it.

       Flat on flat. No shadow, no rim, no gradient — the gap does all the work of
       separating the two, and anything on top of it only muddies the edge.

       The chip is lighter than the pill, not darker. A near-black chip turned the
       gap into a bright hairline: a thin strip of pill with something much darker
       on one side of it reads as a stroke, which is the border there is no border
       for. Lighter, and the gap is just a gap. */
    .pill button::before { content:''; position:absolute; inset:0;
      border-radius:50%; background:transparent; opacity:0;
      transition:background .12s, opacity .14s; }
    .pill button svg { position:relative; display:block;
      width:calc(19 * var(--s)); height:calc(19 * var(--s));
      shape-rendering:geometricPrecision; }
    /* thicker only, not a different shape, so it does not jump when it lights */
    .pill button.on svg { stroke-width:1.9; }
    .pill button:hover { color:#e9e9ee; }
    .pill button:hover::before { background:#3a3a3f; }
    /* In a call: the circle fills and the icon goes white, the way a call control
       does. The bars underneath are moving, which is the part that says live. */
    .pill button.on { color:#ffffff; }
    .pill button.on::before { background:#48484e; }
    .pill button.on:hover::before { background:#54545b; }

    /* Below him, in the transparent band the pill lives in, and fully round so it
       belongs to the same family as the pill rather than to the panel above it.
       They share the spot because only one of them is ever up. */
    #sayclose { display:flex; }
    /* It grows out of the capsule and shrinks back into it, on the same curve and
       to the same size the button bar collapses to. It used to fade while sliding
       down, which reads as the thing falling away rather than closing — and the
       capsule it shares a spot with was already doing the right gesture. */
    .saywrap { position:fixed; left:50%; transform:translateX(-50%);
      top:var(--bar); font-size:calc(12.5 * var(--s));
      width:calc(40 * var(--s)); height:calc(14 * var(--s));
      display:flex; align-items:center; border-radius:99px; overflow:hidden;
      background:#2a2a2d;
      opacity:0; pointer-events:none;
      transition:width .24s cubic-bezier(.2,.85,.25,1),
                 height .24s cubic-bezier(.2,.85,.25,1),
                 opacity .18s; z-index:22; }
    body.typing .saywrap { opacity:1; pointer-events:auto;
      width:calc(100vw - 24 * var(--s)); height:calc(46 * var(--s)); }
    /* The contents are not squeezed into the capsule, they are simply not there
       yet — the same way the buttons handle it. */
    .saywrap #say, .saywrap #sayclose { opacity:0; transition:opacity .12s; }
    body.typing .saywrap #say, body.typing .saywrap #sayclose { opacity:1;
      transition:opacity .16s .08s; }
    /* Grey, like everything else down here. The blue is his — it belongs to the
       face, not to the chrome you type into. */
    #say { flex:1 1 auto; width:auto; min-width:0; border:0; border-radius:0;
      background:transparent; text-align:left; font-size:calc(14 * var(--s));
      color:#e8e8ea; caret-color:#e8e8ea;
      padding:calc(11 * var(--s)) calc(4 * var(--s))
              calc(11 * var(--s)) calc(16 * var(--s)); }
    #say:focus { background:transparent; }
    #say::placeholder { color:#86868c; }
    /* Same gesture as the pill. */
    #sayclose { position:relative; flex:0 0 auto; background:none; border:0;
      color:#9b9ba1; align-self:stretch; display:flex;
      padding:0 calc(13 * var(--s)) 0 calc(7 * var(--s));
      align-items:center; cursor:pointer; transition:color .12s; }
    #sayclose::before { content:''; position:absolute;

// --- mic level ---------------------------------------------------------------
//
// SpeechRecognition hands back text but never amplitude, so there is no way to tell
// from it whether the mic is even hearing you — you only learn anything once a whole
// utterance has been recognised AND a decision has come back. That is far too late to
// answer "is this thing on". A second, independent Web Audio tap on the mic gives a
// live level, which is the only honest "I can hear you" signal available.

let analyser = null, audioBuf = null, audioCtx = null, micStream = null;

async function startLevels() {
  micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  audioBuf = new Uint8Array(analyser.fftSize);
}

  if (micStream) for (const t of micStream.getTracks()) t.stop();
  if (audioCtx) audioCtx.close().catch(() => {});
  analyser = null; audioBuf = null; audioCtx = null; micStream = null;
  level = 0; HIST.fill(0);
}

  if (!analyser) return 0;
  analyser.getByteTimeDomainData(audioBuf);

  for (let i = 0; i < audioBuf.length; i++) { const v = (audioBuf[i] - 128) / 128; sum += v * v; }
  const rms = Math.sqrt(sum / audioBuf.length);
  // room tone sits around 0.005; speech runs an order of magnitude above it
  return Math.min(1, Math.max(0, (rms - 0.006) / 0.075));
}

// — hue 214, saturation 72 — through a whole shading pass done on the canvas, which
// is exactly the drift that having two renderers invites. Neither of them gets to
// hold its own copy.

// the dim end and only picks up colour as it gets brighter.

// more and the grid competes with the face drawn on it, any less and the panel is
// just black with some lit shapes on it.
//
// Two numbers because the two renderers composite differently: the canvas draws the
// lattice as an alpha over a partially-cleared frame, so it accumulates, while the
// shader adds a colour once per frame. Measured on screen, the shader's 0.012 put
// the lattice about one-and-a-half values out of 255 above the gaps between dots,

// same grid, and two copies of it would drift.

// He used to fringe red and blue as you spoke — a lens coming apart. It read as a
// malfunction rather than as attention, so it is gone: leaning in and widening his
// eyes says the same thing about listening without saying anything about breaking.

// ---- nod and shake -----------------------------------------------------------
// He answers before the log does: a nod when he acted, a shake when he could not.

  const attack = Math.min(1, e / 0.12);

function drawFace(t) {

  // little, so a dot that goes out fades instead of cutting. A worse monitor

  // stream is empty until you speak, so reserving its height left him sitting high.

  // Cells are snapped to whole device pixels, and the GAP is what stays constant.
  //

  // so drawing each dot at `origin + index * pitch` with one fixed size lands some
  // gaps a pixel wider than their neighbours, and at this scale one pixel is a
  // visible difference. Deriving each dot from its own rounded cell edges makes
  // every gap exactly GAP; what varies instead is the dot, by at most a pixel,
  // which reads as nothing.
  const GAP = Math.max(1, Math.round(cell * 0.14));

  const edgeY = (g) => Math.round(oy + g * cellY);

  // The lattice runs past every edge of the window, not just across the face's own
  // grid. A panel that stops short of the glass is a picture of a panel; the dots
  // have to reach the corners, and the face is then something lit *on* it. Same
  // grid, same origin, so the two stay in register — including through a nod,
  // where the whole display moves rather than the face sliding across it.
  const gx0 = Math.floor(-ox / cellX) - 1, gx1 = Math.ceil((w - ox) / cellX) + 1;

      let m = 0;

        m = px_[(sy * MW + sx) * 4 + 3] / 255;
      }

      // Every cell is drawn, lit or not. An unlit dot is not absent — it is a dot
      // with nothing behind it, a shade up from the black between dots. Skipping
      // them leaves features floating in a void; drawing them puts the face on a
      // panel, and the panel is most of why the reference reads as hardware.
      //
      // It goes straight to the output, not onto the layer the bloom reads. An
      // unlit pixel emits nothing, so it must not glow — routed through the bloom
      // the whole lattice lifts into a grey haze and the black dies.
      // Same size as a lit dot. Shrinking these seemed right — an unlit emitter
      // shows only its own body, not its bloom — but it reads as a second, finer
      // grid sitting behind the first, because wider gaps are exactly what a
      // smaller pitch looks like. It is one panel: a cell is the same cell whether
      // or not there is anything behind it.
      const x0 = edgeX(gx), y0 = edgeY(gy);
      const dw = Math.max(1, edgeX(gx + 1) - x0 - GAP);
      const dh = Math.max(1, edgeY(gy + 1) - y0 - GAP);

      if (m < 0.06) {
        fx.fillStyle = `rgba(126,148,184,${LATTICE})`;
        fx.fillRect(x0, y0, dw, dh);

      // is the same uneven-gap artefact arriving by another route.
      const amp = (0.4 + level * 2.0);

      const jy = Math.round((hash(gx, gy) - 0.5) * amp * (1 - m * 0.8));

      // 6%-coverage dot at low alpha still read against black; over a lattice it
      // sinks into it, and the soft top and bottom of each eye — which is most of
      // the eye's shape — dissolved. The ramp now starts high and moves less.
      const a = (0.62 + 0.38 * m) * (0.84 + level * 0.16);

      // These are the colours *before* two additive bloom passes land on top, so
      // they have to sit well under the target. Measured on the canvas at the old
      // values: green and blue were both pinned at 255 across the whole face, which
      // leaves only red free to vary — which is exactly why it read as white with a
      // cyan cast rather than as blue. Roughly 60% of the intended final value
      // leaves the bloom somewhere to go.
      const l = 30 + level * 4 + m * 26;

      // rather than to a flat blue — but only part way. Pulling it to grey took the
      // blue out of the face entirely.
      const sa = Math.max(20, sat * (1 - m * 0.30));

      // reads as a smaller bright pixel inside a dim one, which is not what an
      // emitter does — it lights up all over.
      if (m > 0.92) {

        // no colour left to say anything with, and the panel stops looking lit
        // and starts looking blown.
        dotsX.fillStyle = `hsla(${hue},${Math.max(22, sat * 0.70)}%,56%,${0.28 + level * 0.14})`;
        dotsX.fillRect(x0 + jx, y0 + jy, dw, dh);

  // glow at all while the browser did. This looks the same everywhere and is cheaper.
  fx.save();

  // the mottling in the dark areas.
  grainPat ??= fx.createPattern(grainC, 'repeat');

  fx.translate((Math.random() * GRAIN) | 0, (Math.random() * GRAIN) | 0);

  fx.restore();
}

  // the silence. Fast to rise, slow to fall, or every gap between words is a twitch.

  // frame, so anything added after they have been read is thrown away unused.

    // around centre and long gaps; looking about is wide and quick; bored is low
    // and slow. All three used to be the same uniform random, which is why he
    // always read as scanning whatever he was doing.

  // blink, and eyes that shut under brows that stay put read as broken rather
  // than asleep. This is the only thing that says it now: there was a small muted
  // microphone in the corner of his panel as well, and two ways of saying the same
  // thing meant one of them was decoration.
  // Only on his whole face, where nothing else says so. On the circles the strip
  // under him spells MUTED, and two ways of saying one thing means one of them is

  // way between them is not a screen. The lamp does fade, over about the time it
  // takes a cold cathode to come up, because that one is a real blend: the two
  // ramps mix, so the green arrives rather than appearing.

  drawWave(now / 1000, level, micLive && !micErr);

  //
  // A head does not swivel its eyes alone: the gaze leads and the face follows,
  // less than one to one. His panel *is* his face, so turning it is that same
  // gesture — and it is the one that carries furthest, because the window moves.

  // Both negated. Looking right turns his right edge away from you, which brings

// --- the screen loop ---------------------------------------------------------
//
// Milind's shape: look at what is drawn, pick one thing, click it, look again, and
// keep going until the goal is satisfied. What makes it terminate rather than run a
// fixed number of clicks is asking "is this already achieved?" against the screen as
// it is *now*, every step.
//
// Code owns the loop, the clicking and the stopping; the model only judges.

const MAX_STEPS = 6;

async function screenLoop(goal) {
  for (let step = 0; step < MAX_STEPS; step++) {
    let d;
    try {
      const r = await fetch('/api/screen/step', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal, first: step === 0, act: true }),
      });
      d = await r.json();
      if (!r.ok) throw new Error(d.error ?? r.status);
    } catch (e) {
      setMood(M.lost); shake();
      ev('err', `screen step ${step + 1}: ${String(e.message).slice(0, 90)}`);
      return;
    }

    const n = `done ${Number(d.done).toFixed(2)} · p ${Number(d.p).toFixed(2)} · ${d.elements} on screen · ${d.ms}ms`;

    if (step === 0 && d.isCommand !== null && d.isCommand < ACT_MIN) {
      setMood(M.idle);
      ev('ign', `<span class="n">${n}</span> → not for me`);
      return;
    }
    if (d.done > 0.5) {
      setMood(M.acted); nod();
      ev('act', `<span class="n">${n}</span> → already done${step ? ` after ${step} step${step > 1 ? 's' : ''}` : ''}`);
      return;
    }
    if (d.action === 'none' || !d.clicked) {
      setMood(M.lost); shake();
      ev('ign', `<span class="n">${n}</span> → nothing on screen matches`);
      return;
    }
    flash(d.at);
    setMood(M.heard);
    ev('act', `step ${step + 1}: <b>${d.label}</b><br><span class="n">${n}</span>`);
    await new Promise((r) => setTimeout(r, 450));   // let the screen settle before looking again
  }
  setMood(M.lost); shake();
  ev('ign', `gave up after ${MAX_STEPS} steps`);
}

// --- Metal hand-off ----------------------------------------------------------
//
// Inside the desktop app the face is drawn by the GPU, on a layer behind this page,
// so it can exceed the display's white. The webview keeps everything it is good at —
// Jev, speech, the moods, the chrome — and just posts the rig's numbers across.
// Pushed at 20 Hz rather than every frame: the shader animates time, wake and the
// gesture decay itself, so the only thing crossing the bridge is state that changed.

// Metal is the default wherever Tauri is reachable, which — since the remote-origin
// capability went in for dragging — now includes this page served over http. That
// was the blocker: without window.__TAURI__ the shader rendered a face that could
// not react to anything. In a plain browser there is no Tauri and no EDR to have, so
// the canvas runs. MIST_METAL=0 on the app forces the canvas too.

  // without getting to say so, he comes back to life on his own rather than being
  // left frozen on whatever the last slider happened to be.
  let labAt = 0;
  window.__TAURI__?.event?.listen?.('mist:lab', e => {

  setInterval(() => {
    const now = performance.now();
    if (labAt && now - labAt < 2500) return;
    const { hue, sat } = palette();
    // The shader has to clip itself to the window's rounded rectangle, because it
    // draws *behind* the webview where no CSS can reach it. Fractions rather than
    // pixels so it does not need to know the backing scale.

    // fixed square-ish panel with free space under him, and the shader has to clip
    // itself to where he actually ends or it paints over that space.
    const wh = window.innerHeight || 392, ww = window.innerWidth || 286;
    const box = floatEl?.getBoundingClientRect();
    const pw = box?.width || ww;

      mouth, lift, tilt, skew, open, level, blink, pupil, pupilScale,
      hue, sat: sat / 100,
      nod: gesture(now, nodAt, 620, 2),
      shake: gesture(now, shakeAt, 620, 2.5),

      tiltX, tiltY,
      lattice: LATTICE_METAL,

      panelWFrac: Math.max(0.1, Math.min(1, pw / ww)),
      panelTopFrac: Math.max(0, Math.min(0.8, top / wh)),

      mask: eyesMode ? 1 : 0,
      // Smaller and closer than they were when they were the whole of him: with a
      // case around them they have to leave a margin, and the gap between them is
      // what the reference actually fixes — a little over four tenths of an eye.
      eyeGrow: eyesMode ? 0.42 : 0,
      // A whole number of cells apart — nineteen. The grid is snapped to device
      // pixels, so where each eye falls between cells decides which of its outer
      // dots light; at an arbitrary spread the two eyes land differently and one
      // clips a crescent the other does not. 176/30 mask units per cell, and the
      // pitch does not depend on the zoom.
      // Forty-eight cells apart at the circles' own pitch, which is whole, so the
      // two eyes fall the same way between cells and neither clips a crescent the
      // other does not.
      eyeSpread: eyesMode ? 0.0801 : 0,

      // Each lit by the thing its own button switches, so pressing one and
      // watching it come on is the same gesture.
      btn: [

        (micLive && !micErr) ? Math.min(1, 0.55 + level * 1.6) : 0,

      // Straight from the pose. These were derived — the top lid from how open he
      // was, the bottom from how wide the smile was — which meant neither could
      // ever be nothing at rest, and the lower one was up under both eyes every
      // time he smiled, which is most of the time. An expression sets them now,
      // and almost every expression sets them to nothing.
      hood: Math.max(0, Math.min(1, hood + heard * 0.10)),
      lidLow: Math.max(0, Math.min(0.95, low)),

      // Mask units. The crop is centred on everything he now is on the circles —
      // the top of the brows down through the bottom of the strip — rather than on
      // the eyes alone, which is where it sat when the eyes were all there was.
      focusX: 91.84, focusY: 179,

// the live level, and the words as they are recognised, before any decision happens.
const micEl = document.getElementById('mic');
// --- reacting while you are still talking -------------------------------------
//
// Everything else here waits for the sentence to finish, which means the face is
// always a sentence behind — you say something and he answers the last thing. This
// runs against the interim transcript instead, so the expression moves with the
// sentence rather than after it.
//
// It reads and does nothing else: no tool, no click, no decision. Five questions,
// ~150ms warm, and the answer is a bias laid over whatever mood he is already in,
// decaying away over a few seconds so he drifts back rather than snapping.
// --- acting before the sentence is over ---------------------------------------
//
// The interim transcript is already being read for the expression; it gets routed
// as well. So "can you pull up slack and i want to send a message to jonathan
// saying…" has Slack open by about the ninth word — before you have said
// "message" — because the router settles on the desktop tool there and that tool
// is reversible.
//
// Two rules keep this from being reckless:
//
//   Only prefetchable tools run early. Switching apps is instant and undone by
//   switching back. Nothing that writes anything is marked prefetchable, so a
//   half-heard sentence can open something but can never send, post or delete.
//
//   The decision has to have stopped moving. A three-word fragment routes almost

  routeStable = tool === routeTool ? routeStable + 1 : 0;

  // "go back" is a whole instruction at two words and waiting for silence is pure

    // and something wrong is not anger unless it also matters. Either one alone
    // is an ordinary day.
    if (bias.valence > 0.86 && bias.force > 0.60) setMood(M.glad);

    // point: a question on its own is just a question.
    else if (bias.asking > 0.70 && bias.force < 0.22) setMood(M.roll);
    else if (bias.trouble > 0.80 && bias.force > 0.62) setMood(M.cross);
