  // It used to match /^(listening|hearing)/ against the status string, which missed
  // two states where the microphone is plainly on: "on (granted)", set by the
  // permission promise — which can resolve *after* recognition has already started
  // and overwrite "listening" — and "restarting", which the keepalive passes
  // through constantly. So his eyes stayed shut while he was listening.
  document.body.classList.toggle('muted', !micLive || !!micErr);
  micEl.className = micErr ? 'perm bad' : 'perm';
  micEl.innerHTML = micErr
    ? `mic: <b>${micErr}</b>`
    : `mic: <b>${micState}</b> · level <span class="lvl">${level.toFixed(2)}</span>`
      + `${lit ? ' ●' : ' ○'}${interim ? ` · “${interim.slice(-60)}”` : ''}`;
}
setInterval(paintMic, 100);

// --- the loop ----------------------------------------------------------------

async function controls() {
  const r = await fetch('/api/desktop/controls', { method:'POST' });
  return r.json();
}
async function act(id) {
  const r = await fetch('/api/desktop/act', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error ?? r.status);
  return d.done;
}

(async () => {
  try {
    const { controls: c, accessibility } = await controls();
    permEl.className = accessibility ? 'perm' : 'perm bad';
    permEl.textContent = accessibility
      ? `can reach ${c.length} things — apps, Chrome tabs, and the frontmost app's menus`
      : `${c.length} things — apps and Chrome tabs only. Menus need Accessibility: `
        + `System Settings › Privacy & Security › Accessibility.`;
  } catch (e) { permEl.className='perm bad'; permEl.textContent = 'proxy not reachable'; }
})();

let busy = false, lastSaid = '';

// What the assistant last asked, so the next utterance can be understood as the
// answer to it rather than as a fresh command. Jev decides which it is.
let pending = null;

const meter = (d) => {
  if (d.usage?.input_tokens == null) return;
  decisions++; inTokens += d.usage.input_tokens;
  const spend = inTokens * USD_PER_INPUT_TOKEN;
  latEl.textContent = `${d.jevMs ?? d.ms}ms`;
  costEl.textContent = `${decisions} decision${decisions===1?'':'s'} · `
    + `$${(spend/decisions).toFixed(6)} each · $${spend.toFixed(5)} total`;
};

const ask = (body) => fetch('/api/ask', { method:'POST',
  headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
  .then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error ?? r.status); return d; });

// ---------------------------------------------------------------------------
// The panel beside him.
//
// Some answers are a shape before they are a sentence. A forecast read out as
// "high 86, low 59, 45% chance of rain" is four numbers to hold; the same thing as
// an icon and a temperature is one glance. So he widens by exactly one more panel
// and draws it on the lattice he is already drawn on, which is why it reads as him
// showing you something rather than as a popover.
//
// The card is the page's, not the shader's: there is one face in that shader and
// this is not a face. The shader is told to stop at half the window instead.
const cardC = document.getElementById('card');
const cardX = cardC.getContext('2d');
const cardBlur = document.createElement('canvas');
const cardBlurX = cardBlur.getContext('2d');
let shown = null, cardTimer = 0;
// One panel, in CSS pixels. Tracked rather than derived so a resize while a card is
// open does not halve him on the next answer.
let panelW = window.innerWidth;
addEventListener('resize', () => {
  panelW = window.innerWidth / (shown ? 2 : 1);
  if (shown) drawCard();
});

// Head band, panel, and the strip of controls under it — the last measured once
// at his design size and kept as a fraction, so every shape he takes is the same
// shape scaled.
const BAND = 0.783;
async function reshape() {
  if (!NATIVE) return;
  const ph = eyesMode ? 1.60 : 1.10;
  // The band under him holds the bar and the text field — except on the circles,
  // where both sit on him and all that is left down there is air.
  // Room under the case for the bar and the text field, which sit below him now
  // rather than on him.
  const band = eyesMode ? 0.34 : BAND;
  try {
    await window.__TAURI__.core.invoke('set_shape', {
      width: panelW * (shown ? 2 : 1),
      height: Math.round(panelW * (0.55 + ph + band)),
    });
  } catch { /* a refused resize is not worth losing the answer over */ }
}

// Which shape his screen is. The menu decides; the page owns the geometry, so it
// is the page that tells the shader.
let eyesMode = false;
// window.__TAURI__ rather than the TAURI const: this block sits above where that
// const is declared, and reaching it from here throws on evaluation — which kills
// the rest of the module, including the face loop, with an error pointing at a
// completely unrelated line.
window.__TAURI__?.event?.listen?.('mist:eyes', (e) => {
  eyesMode = !!e.payload;
  document.documentElement.classList.toggle('eyes', eyesMode);
  reshape();
});

// The strip under his eyes, and what it is reading out.
//
// Six cells of three-by-five glyphs, sent as indices into the shader's own font.
// The words are the page's business and the shapes are the shader's, and neither
// has to know how the other spells — which is also why this is not a string: a
// uniform is a number, and six numbers is the whole protocol.
const GLYPHS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.:-';
const SLOTS = 12, SEEN = 9;               // twelve sent, nine across the strip

function glyphs(str, from = 0, off = 0) {
  const t = new Array(SLOTS).fill(0);
  for (let i = 0; i < SLOTS - off; i++) {
    const g = GLYPHS.indexOf(str[from + i] ?? ' ');
    if (g > 0) t[off + i] = g;
  }
  return t;
}

function readout(word) {
  const w = String(word).toUpperCase().slice(0, SEEN);
  // Centred across what you can see, not across what is sent. A five-letter word
  // hard against the left of the strip reads as a word that did not fit.
  return glyphs(w, 0, Math.floor((SEEN - w.length) / 2));
}

// A ticker while he talks.
//
// The display is the only part of him that can say *what* he is saying rather than
// that he is saying something, and a line of text that appears all at once is a
// label. This scrolls: the page keeps the whole sentence, sends the twelve
// characters nearest the window and how far between two of them it is, and the
// shader slides the grid by that. Seven a second rather than the fifteen and a
// half he actually reads at — a ticker is for reading, and his voice is already
// carrying the pace.
const TICK_CPS = 5;
let tickMsg = '', tickAt = 0;
function ticker(now) {
  const live = talking && talkText ? '   ' + talkText.toUpperCase() + '        ' : '';
  if (live !== tickMsg) { tickMsg = live; tickAt = now; }
  if (!live) return { text: readout(stateWord()), shift: 0 };
  const pos = Math.max(0, (now - tickAt) / 1000 * TICK_CPS);
  const i = Math.floor(pos);
  if (i >= live.length) return { text: readout(stateWord()), shift: 0 };
  return { text: glyphs(live, i), shift: (pos - i) * 8 };   // eight cells a character
}

/// What he is doing, in six characters or fewer.
///
/// Ordered by what would interrupt what: he cannot be listening while he is
/// talking, and the microphone being off outranks both because it is the one state
/// you might not have chosen.
function stateWord() {
  if (document.body.classList.contains('muted')) return 'MUTED';
  if (talking) return 'TALKS';
  if (mood === M.ask) return 'THINKS';
  if (micLive && !micErr) return level > 0.10 ? 'HEARS' : 'LISTEN';
  return 'READY';
}

// Which kind of screen he is, and whether there is a lamp behind it.
//
// Not a palette swap. Everything else about him assumes light comes out: a lit cell
// is bright, it blooms, and its core goes past white where the display has the
// headroom for it. A reflective panel is the other way round — the cell that is on
// is the one that has gone dark, and the brightest thing on him is the glass doing
// nothing. The shader owns that inversion; these two only say which screen and
// whether the lamp is on.
let lcdMode = false, lampOn = false;
let lcd = 0, lamp = 0;
// Being thrown across the desk, and hitting something.
//
// The physics lives in Rust and the face lives here, so the two only meet through
// these: launched is a fright, and every wall after that is an indignity. Both
// lapse back to idle on the usual timer, so a long glide ends with him composed.
window.__TAURI__?.event?.listen?.('mist:thrown', () => { setMood(M.scared); });
window.__TAURI__?.event?.listen?.('mist:bump', () => { setMood(M.cross); shake(); });
// What he is saying, for the readout to scroll — sent by whoever asked him to say
// it rather than by the one path that used to know.
window.__TAURI__?.event?.listen?.('mist:said', (e) => { talkText = String(e.payload ?? ''); });
window.__TAURI__?.event?.listen?.('mist:lcd', () => { lcdMode = !lcdMode; });
window.__TAURI__?.event?.listen?.('mist:lamp', () => { lampOn = !lampOn; });

async function showCard(c) {
  clearTimeout(cardTimer);
  if (!c || c.kind !== 'weather') { hideCard(); return; }
  shown = weatherCard(c);
  document.documentElement.classList.add('card');
  await reshape();
  drawCard();
  // It is an answer, not a dashboard. It goes when the answer has been read.
  cardTimer = setTimeout(hideCard, 45000);
}

async function hideCard() {
  clearTimeout(cardTimer);
  if (!shown) return;
  shown = null;
  document.documentElement.classList.remove('card');
  await reshape();
}

/// The same dot pass his face gets, on the same lattice, at the same pitch — the
/// two panels have identical dimensions, so the identical fit puts every cell of
/// this one in register with every cell of his.
function drawCard() {
  if (!shown) return;
  const r = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(cardC.clientWidth * r));
  const h = Math.max(1, Math.round(cardC.clientHeight * r));
  if (cardC.width !== w || cardC.height !== h) { cardC.width = w; cardC.height = h; }
  if (cardBlur.width !== w || cardBlur.height !== h) { cardBlur.width = w; cardBlur.height = h; }

  const { hue, sat } = palette();
  cardX.fillStyle = '#04060a';
  cardX.fillRect(0, 0, w, h);
  cardBlurX.clearRect(0, 0, w, h);

  const fit = Math.min(w * 0.94 / MW, h * 0.86 / MH);
  const fw = MW * fit, fhh = MH * fit;
  const cellX = fw / NX, cellY = fhh / NY, cell = Math.min(cellX, cellY);
  const ox = (w - fw) / 2, oy = (h - fhh) / 2;
  const GAP = Math.max(1, Math.round(cell * 0.14));
  const edgeX = (g) => Math.round(ox + g * cellX);
  const edgeY = (g) => Math.round(oy + g * cellY);

  const gx0 = Math.floor(-ox / cellX) - 1, gx1 = Math.ceil((w - ox) / cellX) + 1;
  const gy0 = Math.floor(-oy / cellY) - 1, gy1 = Math.ceil((h - oy) / cellY) + 1;

  for (let gy = gy0; gy < gy1; gy++) {
    for (let gx = gx0; gx < gx1; gx++) {
      const on = gx >= 0 && gx < shown.cols && gy >= 0 && gy < shown.rows;
      const m = on ? shown.cells[gy * shown.cols + gx] : 0;
      const x0 = edgeX(gx), y0 = edgeY(gy);
      const dw = Math.max(1, edgeX(gx + 1) - x0 - GAP);
      const dh = Math.max(1, edgeY(gy + 1) - y0 - GAP);
      if (m < 0.06) {
        cardX.fillStyle = `rgba(126,148,184,${LATTICE})`;
        cardX.fillRect(x0, y0, dw, dh);
        continue;
      }
      const a = 0.62 + 0.38 * m;
      const l = 30 + m * 26;
      const sa = Math.max(20, sat * (1 - m * 0.30));
      cardBlurX.fillStyle = `hsla(${hue},${sa}%,${l}%,${a})`;
      cardBlurX.fillRect(x0, y0, dw, dh);
      if (m > 0.92) {
        cardBlurX.fillStyle = `hsla(${hue},${Math.max(22, sat * 0.70)}%,56%,0.20)`;
        cardBlurX.fillRect(x0, y0, dw, dh);
      }
    }
  }

  cardX.drawImage(cardBlur, 0, 0);
  // Two passes rather than his three: a card is read, and the far soft lift that
  // makes his face look lit makes small type look damp. Weaker than his, too — he
  // is drawn by the shader with headroom above white and this is not, so matching
  // his numbers here does not match his brightness, it just runs out of colour.
  cardX.save();
  cardX.globalCompositeOperation = 'lighter';
  for (const [div, alpha] of [[3, 0.40], [10, 0.24]]) {
    const bw = Math.max(1, Math.round(w / div)), bh = Math.max(1, Math.round(h / div));
    const tmp = document.createElement('canvas');
    tmp.width = bw; tmp.height = bh;
    const tx = tmp.getContext('2d');
    tx.imageSmoothingEnabled = true;
    tx.drawImage(cardBlur, 0, 0, bw, bh);
    cardX.globalAlpha = alpha;
    cardX.drawImage(tmp, 0, 0, w, h);
  }
  cardX.restore();
}

repaintCard = () => { if (shown) drawCard(); };

/// Where he clicked, drawn in his own pixels for half a second.
///
/// The proxy hands the point back with the sentence because nothing on this side
/// knows it: the accessibility path presses an element, not a coordinate, and the
/// element's frame is only known over there.
function flash(at) {
  if (!NATIVE || !Array.isArray(at)) return;
  const [x, y] = at;
  if (!Number.isFinite(x) || !Number.isFinite(y)) return;
  window.__TAURI__.core.invoke('flash_cursor', { x, y }).catch(() => {});
}

// ---------------------------------------------------------------------------
// A call, not a toggle.
//
// Turning the microphone on used to change a colour. Two square-wave notes up on
// connect and down on hang-up, and the level bars moving while it is open, is the
// vocabulary every phone has used for forty years — you know which one happened
// without looking at the screen.
let ac = null;
function blip(up) {
  try {
    ac ??= new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const notes = up ? [587.33, 880] : [587.33, 392];
    notes.forEach((hz, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square';                       // old hardware, on purpose
      o.frequency.value = hz;
      const t = ac.currentTime + i * 0.085;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + 0.1);
    });
  } catch { /* no audio context is not a reason to fail to listen */ }
}

// The five bars, driven by the microphone. Each has its own phase so they do not
// pump as one block, and a floor so the shape stays a shape at silence.
const waveEl = document.getElementById('wave');
const bars = waveEl ? [...waveEl.querySelectorAll('line')] : [];
const BAR_REST = [5, 10, 15, 10, 5];
function drawWave(t, lvl, live) {
  if (!bars.length) return;
  bars.forEach((ln, i) => {
    const rest = BAR_REST[i];
    const h = live
      ? rest * (0.42 + 1.05 * lvl * (0.55 + 0.45 * Math.sin(t * 7 + i * 1.7)))
      : rest;
    const half = Math.max(1.2, Math.min(9.5, h / 2));
    ln.setAttribute('y1', (12 - half).toFixed(2));
    ln.setAttribute('y2', (12 + half).toFixed(2));
  });
}

// ---------------------------------------------------------------------------
// The other wave: his, not yours.
//
// The five bars above are a picture of what the microphone is hearing. These are a
// picture of what he is saying, and they take the whole capsule while he says it.
// Fifteen of them, tallest in the middle and tapering out, which is the shape a
// row of bars has to have to read as a mouth rather than as a meter.
const mouthEl = document.getElementById('mouthwave');
const MBARS = 15;
const mbars = [];
if (mouthEl) {
  for (let i = 0; i < MBARS; i++) {
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const x = (2 + i * (72 / (MBARS - 1))).toFixed(3);
    ln.setAttribute('x1', x); ln.setAttribute('x2', x);
    ln.setAttribute('y1', '17.2'); ln.setAttribute('y2', '18.8');
    mouthEl.appendChild(ln);
    mbars.push(ln);
  }
}

let talking = false, talkText = '', talkAt = 0, talkAmp = 0;

/// Loud where a voice is loud.
///
/// NSSpeechSynthesizer will not tell you how loud it is being, and it does not need
/// to: the sentence is right here. Stepping through the characters at the rate he
/// reads them is a better envelope than a meter would be, because the pauses land
/// on the spaces and the punctuation instead of wherever a smoothing constant put
/// them. Vowels open a mouth; stops close it.
function loudness(ch) {
  if (!ch) return 0;
  if (ch === ' ' || ch === '\t' || ch === '\n') return 0.05;
  if (',.;:!?—'.indexOf(ch) >= 0) return 0.02;
  if ('aeiouyAEIOUY'.indexOf(ch) >= 0) return 1.0;
  if ('mnlrwvzjMNLRWVZJ'.indexOf(ch) >= 0) return 0.60;
  return 0.32;
}

const TALK_CPS = 15.5;            // characters a second, at the rate Zarvox reads

function drawMouth(t, amp) {
  if (!mbars.length) return;
  const mid = (MBARS - 1) / 2;
  for (let i = 0; i < MBARS; i++) {
    // One shape, not fifteen meters: a taper across the row so the ends stay
    // shorter than the middle, and a phase offset per bar so the wave travels
    // along it instead of the whole row pumping together.
    const shape = 0.20 + 0.80 * Math.cos((i - mid) / mid * 1.30);
    const wob = 0.66 + 0.34 * Math.sin(t * 11 + i * 0.85);
    const half = Math.max(1.4, Math.min(15.2, 1.4 + 14.4 * amp * shape * wob));
    mbars[i].setAttribute('y1', (18 - half).toFixed(2));
    mbars[i].setAttribute('y2', (18 + half).toFixed(2));
  }
}

// Rust watches the synthesizer and says when it starts and stops. Sixty-four
// milliseconds of granularity, which is finer than an ear can place the start of a
// sentence and far finer than the fade.
window.__TAURI__?.event?.listen?.('mist:talking', (e) => {
  talking = !!e.payload;
  if (talking) talkAt = performance.now();
  document.body.classList.toggle('talking', talking);
});

// ---------------------------------------------------------------------------
// His voice. The oldest one macOS still ships, because a robot that sounds like a
// robot is the point — a natural voice here would be a different character.
let robot = null;
function pickVoice() {
  const all = speechSynthesis.getVoices?.() ?? [];
  for (const name of ['Zarvox', 'Trinoids', 'Albert', 'Ralph', 'Fred', 'Junior']) {
    const v = all.find((v) => v.name === name);
    if (v) return v;
  }
  return all.find((v) => (v.lang || '').startsWith('en')) ?? null;
}
try {
  robot = pickVoice();
  speechSynthesis.addEventListener('voiceschanged', () => { robot = pickVoice(); });
} catch { /* no speech synthesis: he stays quiet */ }

function say(text) {
  if (!text) return;
  const line = String(text).slice(0, 260);
  talkText = line;                            // what the bars are going to step through
  // In the app it goes through AppKit. Inside a WKWebView getVoices() returns an
  // empty list — measured, not assumed — so every word he has ever said came out in
  // the system default voice while the robot he was meant to be stayed unreachable.
  // The classic voices are all installed; they are just not offered to web content.
  if (NATIVE) {
    window.__TAURI__.core.invoke('speak', { text: line }).catch(() => {});
    return;
  }
  try {
    speechSynthesis.cancel();                 // a newer answer replaces an older one
    const u = new SpeechSynthesisUtterance(line);
    if (robot) u.voice = robot;
    u.rate = 1.0;
    u.pitch = 0.75;
    // The app hears about this from Rust watching the synthesizer; in a browser the
    // utterance says so itself.
    u.onstart = () => { talking = true; talkAt = performance.now();
      document.body.classList.add('talking'); };
    u.onend = u.onerror = () => { talking = false;
      document.body.classList.remove('talking'); };
    speechSynthesis.speak(u);
  } catch { /* ditto */ }
}

const thinkEl = document.getElementById('think');
const bubEl = document.getElementById('bub');
let thinkTimer = 0;

/// One thing at a time, above his head, gone when it has been read.
function think(text, source) {
  clearTimeout(thinkTimer);
  if (!text) { thinkEl.classList.remove('on'); return; }
  bubEl.innerHTML = esc(text)
    + (source ? `<span class="src">${esc(source)}</span>` : '');
  thinkEl.classList.add('on');
  // Long enough to read twice, and it can always be dismissed sooner.
  const ms = 4000 + Math.min(9000, String(text).length * 55);
  thinkTimer = setTimeout(() => thinkEl.classList.remove('on'), ms);
}
bubEl.addEventListener('click', () => { clearTimeout(thinkTimer);
  thinkEl.classList.remove('on'); });

function answer(said, d, note) {
  showCard(d.card ?? null);
  say(d.reply);
  think(d.reply, d.source);
  const row = ev('ans', `<b>\u201c${esc(said)}\u201d</b><br><span class="n">${esc(note)}</span>`
    + `<div class="say">${esc(d.reply)}</div>`
    + (d.source ? `<div class="src">${esc(d.source)}</div>` : ''));
  return row;
}

// Everything starts here. One request routes the utterance and fills every
// candidate tool's arguments at once; only the winner's are read. A desktop
// command hands off to the older path below, whose Choice is built from controls
// that only exist at click time and so cannot join the speculative set.
async function decide(said) {
  if (busy || !said.trim() || said === lastSaid) return;
  busy = true; lastSaid = said;
  try {
    const d = await ask({ text: said, question: pending?.question ?? null });
    meter(d);
    const note = `${d.kind} \u00b7 addressed ${(d.addressed ?? 0).toFixed(2)} \u00b7 ${d.used}/${d.asked} asked \u00b7 ${d.jevMs}ms`;

    if (d.kind === 'chatter') {
      setMood(M.idle);
      ev('ign', `<b>\u201c${esc(said)}\u201d</b><br><span class="n">${esc(note)}</span> \u2192 not for me`);
    } else if (d.kind === 'cancel') {
      pending = null; setMood(M.idle);
      ev('ign', `<b>\u201c${esc(said)}\u201d</b><br><span class="n">${esc(note)}</span> \u2192 cancelled`);
    } else if (d.kind === 'answers_previous' && pending?.confirm) {
      const token = pending.confirm; pending = null;
      const done = await ask({ confirm: token });
      setMood(M.acted); nod();
      answer(said, done, note);
    } else if (d.kind === 'woken') {
      // His name and nothing else. He answers the way a person does when called
      // from across a room: looks up, says yes, waits.
      pending = null; setMood(M.ask);
      answer(said, d, note);
    } else if (d.handoff === 'drive') {
      await driveDecide(said);
    } else if (d.confirm) {
      // A write. Show exactly what will happen and wait for a yes — by button or
      // by voice, which is why the question is held rather than the arguments.
      setMood(M.ask);
      pending = { question: d.reply, confirm: d.confirm };
      const row = answer(said, d, note);
      const go = document.createElement('div'); go.className = 'go';
      const yes = document.createElement('button'); yes.textContent = 'do it';
      const no = document.createElement('button'); no.textContent = 'no';
      go.append(yes, no); row.append(go);
      yes.onclick = async () => {
        go.remove(); const token = pending?.confirm; pending = null;
        try { const done = await ask({ confirm: token });
              row.querySelector('.say').textContent = done.reply; setMood(M.acted); nod(); }
        catch (e) { row.className = 'ev err'; row.append(document.createTextNode(' ' + e.message)); } };
      no.onclick = () => { go.remove(); pending = null; row.className = 'ev ign'; setMood(M.idle); };
    } else if (d.reply) {
      pending = null;
      setMood(d.tool ? M.acted : M.lost); if (d.tool) nod(); else shake();
      answer(said, d, note);
    } else {
      setMood(M.idle);
    }
    errEl.textContent = '';
  } catch (e) {
    errEl.textContent = String(e.message ?? e).slice(0, 70);
    ev('err', `<b>\u201c${esc(said)}\u201d</b><br>${esc(String(e.message ?? e).slice(0,110))}`);
    lastSaid = '';
  } finally { busy = false; }
}

// --- the accessibility loop ---------------------------------------------------
//
// What the drive loop cannot do. "Open slack to the chat with roman" brings Slack
// forward and stops there, because the drive loop knows apps, tabs and menu items,
// and a sidebar conversation is none of those. The accessibility tree has every one
// of them by name.
//
// Run after any app switch. The first question it asks is whether the goal is
// already met, so when "open slack" really was the whole request this costs one
// call and does nothing — which is the right price for not having to know in
// advance which it was.
const AX_STEPS = 4;

async function axLoop(goal, app = null) {
  let acted = false;
  for (let step = 0; step < AX_STEPS; step++) {
    let d;
    try {
      d = await fetch('/api/ax/step', { method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ goal, app, act: true }) }).then((r) => r.json());
    } catch { return acted; }
    if (d.error || !d.controls) return acted;    // nothing exposed: leave it alone

    if (d.done > 0.5) { if (step > 0) { setMood(M.acted); nod(); } return acted; }
    if (d.action === 'none' || d.confidence < CONF_MIN) return acted;
    if (!d.pressed) return acted;
    acted = true;
    flash(d.at);

    ev('act', `<span class="n">${esc(d.app)} \u00b7 ${d.controls} controls</span>`
      + `<div class="say">\u2192 ${esc(d.pressed)}${d.typed ? ` \u2192 typed \u201c${esc(d.typed)}\u201d` : ''}</div>`);
    setMood(M.acted); nod();
    await new Promise((r) => setTimeout(r, 700));
  }
  return acted;
}

// The older path: a Choice built from the controls that exist at this instant —
// running apps, open tabs, the frontmost app's menus — then the screen-reading
// loop if none of them match.
/// `partial` means the sentence is still being spoken.
///
/// Bringing an app forward on half a sentence is the whole point of prefetching —
/// "open sla" is unambiguous and switching back is free. Acting *inside* an app is
/// different: the goal text is what picks the control, so a truncated goal picks a
/// control for a request nobody made. A partial gets the app switch and stops.
async function driveDecide(said, partial = false) {
  const { controls: list } = await controls();
  const r = await fetch('/api/drive', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text: said, controls: list }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error ?? r.status);

  decisions++; inTokens += d.usage?.input_tokens ?? 0;
  const spend = inTokens * USD_PER_INPUT_TOKEN;
  latEl.textContent = `${d.ms}ms`;
  costEl.textContent = `${decisions} decision${decisions===1?'':'s'} · `
    + `$${(spend/decisions).toFixed(6)} each · $${spend.toFixed(5)} total`;

  const n = `cmd ${d.isCommand.toFixed(2)} · p ${d.p.toFixed(2)} · conf ${d.confidence.toFixed(2)}`;
  const label = list.find(c => c.id === d.action)?.label ?? d.action;

  if (d.isCommand < ACT_MIN) {
    setMood(M.idle); ev('ign', `<b>“${said}”</b><br><span class="n">${n}</span> → not for me`);
  } else if (d.action === 'none' || d.confidence < CONF_MIN) {
    // Apps, tabs and menus have nothing, which is the normal answer for anything
    // happening *inside* the window you are already looking at: "go back", "scroll
    // down", "click the first result" all come back none, because none of them is
    // an app, a tab or a menu item.
    //
    // The accessibility tree is where those live, so it gets the next turn. This
    // used to drop straight to OCR, which was written before axtree existed and
    // never revisited — OCR is slower, cannot see a control that draws no text, and
    // hands back a coordinate rather than an element. It stays as the last resort,
    // for canvases, video, and anything that exposes no tree at all.
    if (partial) return;                    // an unfinished goal picks unfinished controls
    const did = await axLoop(said, null);
    if (!did) {
      ev('ign', `<b>“${said}”</b><br><span class="n">${n}</span> → nothing in the tree, reading the screen…`);
      await screenLoop(said);
    }
  } else if (confirmMenus && d.action.startsWith('item:')) {
    // Menu items can close things. Ask.
    setMood(M.ask);
    const row = ev('ask', `<b>“${said}”</b><br><span class="n">${n}</span> → <b>${label}</b>`);
    const go = document.createElement('div'); go.className = 'go';
    const yes = document.createElement('button'); yes.textContent = 'do it';
    const no = document.createElement('button'); no.textContent = 'no';
    go.append(yes, no); row.append(go);
    yes.onclick = async () => { go.remove(); row.className='ev act';
      try { row.innerHTML += `<br>✓ ${await act(d.action)}`; setMood(M.acted); nod(); }
      catch (e) { row.className='ev err'; row.innerHTML += `<br>${e.message}`; } };
    no.onclick = () => { go.remove(); row.className='ev ign'; setMood(M.idle); };
  } else if (d.action.startsWith('app:') && d.confidence < APP_MIN) {
    setMood(M.lost); shake();
    ev('ign', `<b>\u201c${esc(said)}\u201d</b>`
      + `<div class="say">I am not sure which app you mean \u2014 the closest running `
      + `one is ${esc(label.replace(/^Bring the | application to the front$/g, ''))}, `
      + `and I am only ${Math.round(d.confidence * 100)}% sure. Is it running?</div>`);
  } else {
    const done = await act(d.action);
    setMood(M.acted); nod();
    ev('act', `<b>“${said}”</b><br><span class="n">${n}</span> → <b>${done}</b>`);
    // Bringing an app forward is often only half of what was asked. The loop asks
    // whether it was, and stops immediately if so.
    // Name the app rather than letting the loop read whatever is frontmost: a
    // notification stealing focus between the switch and the look is enough to make
    // it reason about the wrong window.
    //
    // Not while the sentence is still being spoken, though: the goal text is what
    // picks the control, and a truncated goal picks a control for a request nobody
    // made.
    if (!partial) {
      await axLoop(said, /brought (.+?) to the front/.exec(done)?.[1] ?? null);
    }
  }
}

// --- keeping out of the way ---------------------------------------------------
//
// He floats over everything, which is the point, right up until he is floating over
// the thing you are reading.
//
// The first version of this avoided the *focused window* and consequently never
// moved once: measured against a real desk, the focused window was full screen, so
// all four corners overlapped it identically, "is anywhere better?" was always no,
// and he sat still forever. Avoiding a window is meaningless when the window is the
// whole screen.
//
// The pointer is the signal that actually means something. Where your mouse is, is
// where you are working — so he keeps his distance from it, and takes the corner
// furthest from it when he has to move. And he glides rather than teleports,
// because a window that jumps reads as a glitch and a window that travels reads as
// a decision.
const TAURI = window.__TAURI__ ?? null;

// He is told when the pointer comes close, because the page has no way to find
// out. :hover fires only once the pointer is already on him, and not even then if
// the app is not active — macOS sends mouse-moved events to the key window only.
// Rust reads the position off AppKit instead. src-tauri/src/near.rs.
if (TAURI?.event?.listen) {
  document.body.classList.add('native');
  TAURI.event.listen('mist:near', e => {
    document.body.classList.toggle('near', !!e.payload);
  });
}
let avoid = true, lastMove = 0, gliding = null;
const MOVE_GAP = 1800, EDGE = 18, REACH = 150;

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x))
                        * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

async function glideTo(win, from, to) {
  // Critically damped-ish: quick to leave, slow to arrive, no overshoot. Sixteen
  // frames at 60Hz is about a quarter of a second, which reads as deliberate.
  gliding = to;
  for (let i = 1; i <= 16; i++) {
    if (gliding !== to) return;                 // a newer move took over
    const k = 1 - Math.pow(1 - i / 16, 3);
    await win.setPosition(new TAURI.window.LogicalPosition(
      Math.round(from.x + (to.x - from.x) * k),
      Math.round(from.y + (to.y - from.y) * k)));
    await new Promise((r) => setTimeout(r, 16));
  }
  gliding = null;
}

async function keepClear() {
  if (!avoid || !TAURI?.window || gliding) return;
  const now = performance.now();
  if (now - lastMove < MOVE_GAP) return;

  let space;
  try { space = await fetch('/api/desktop/space').then((r) => r.json()); } catch { return; }
  const { mouse, focus, screen, front } = space ?? {};
  if (!screen) return;
  if (front?.app === 'Rove') return;

  const win = TAURI.window.getCurrentWindow();
  const sf = await win.scaleFactor();
  const p = await win.outerPosition(), sz = await win.outerSize();
  const me = { x: p.x / sf, y: p.y / sf, w: sz.width / sf, h: sz.height / sf };

  // He does not run from the pointer. He has a text box and a microphone button on
  // him, so the pointer coming near him usually means it is coming *for* him, and a
  // window that dodges the hand reaching for it is infuriating. The first version
  // did exactly that.
  if (mouse) {
    const near = dist(Math.max(me.x, Math.min(mouse.x, me.x + me.w)),
                      Math.max(me.y, Math.min(mouse.y, me.y + me.h)),
                      mouse.x, mouse.y);
    if (near < REACH) return;
  }

  // What he does get out of the way of is the thing you are typing into. The caret's
  // own element is the only signal here that means "the work is here": the focused
  // window is the whole screen and tells you nothing, and the pointer means the
  // opposite of what it looks like. If the app will not say, he stays put — which is
  // the right default for something that floats over everything.
  if (!focus) return;
  // Some apps name the whole window as their focused element, which is not a caret
  // and not a place you are working — it is the absence of an answer wearing one's
  // clothes. Taken at face value it overlaps him permanently and he never stops
  // moving.
  if (focus.role === 'AXWindow' || focus.w * focus.h > screen.w * screen.h * 0.35) return;
  if (overlap(me, focus) < me.w * me.h * 0.05) return;

  const spots = [
    { x: screen.x + screen.w - me.w - EDGE, y: screen.y + EDGE },
    { x: screen.x + screen.w - me.w - EDGE, y: screen.y + screen.h - me.h - EDGE },
    { x: screen.x + EDGE,                   y: screen.y + EDGE },
    { x: screen.x + EDGE,                   y: screen.y + screen.h - me.h - EDGE },
  ];
  let best = null;
  for (const sp of spots) {
    const ov = overlap({ ...sp, w: me.w, h: me.h }, focus);
    const travel = dist(sp.x, sp.y, me.x, me.y);
    if (travel < 40) continue;
    const cost = ov * 1000 + travel;
    if (!best || cost < best.cost) best = { ...sp, cost, ov };
  }
  if (!best || best.ov >= overlap(me, focus)) return;

  lastMove = now;
  await glideTo(win, me, best);
}

if (TAURI?.window) setInterval(keepClear, 1500);
// `a` toggles it, because the right amount of autonomy for a window that moves
// itself is "and you can turn it off".
addEventListener('keydown', (e) => {
  if (e.key === 'a' && e.target.tagName !== 'INPUT') {
    avoid = !avoid;
    ev('ign', avoid ? 'staying out of your way' : 'staying put');
  }
});

document.getElementById('auto').addEventListener('click', (e) => {
  confirmMenus = !confirmMenus;
  e.target.textContent = confirmMenus ? 'confirm menus' : 'menus auto';
  e.target.classList.toggle('on', !confirmMenus);
});

const listenBtn = document.getElementById('listen');
const SR = window.SpeechRecognition ?? window.webkitSpeechRecognition;
let recog = null;
listenBtn.addEventListener('click', () => {
  if (!SR) { errEl.textContent = 'no SpeechRecognition — use Chrome'; return; }
  if (recog) { recog.stop(); recog=null; listenBtn.textContent='start listening';
    listenBtn.classList.remove('on'); setMood(M.idle); stopLevels();
    micState = 'off'; micLive = false; interim = ''; blip(false); return; }
  micErr = ''; micState = 'starting'; blip(true);
  startLevels()
    .then(async () => { micLive = true; micState = `on (${await permState()})`; })
    .catch((e) => { micErr = `level: ${e.name ?? e.message}`; });

  recog = new SR(); recog.continuous=true; recog.interimResults=true; recog.lang='en-US';
  recog.onstart = () => { micLive = true; micState = 'listening'; micErr = ''; };
  recog.onspeechstart = () => { micState = 'hearing speech'; };
  recog.onspeechend = () => { micState = 'listening'; };
  recog.onresult = (e) => {
    let live = '';
    for (let i=e.resultIndex; i<e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { interim = ''; resetRoute(); setMood(M.heard); decide(r[0].transcript.trim()); }
      else live += r[0].transcript;
    }
    if (live) { interim = live; readLive(live.trim()); routeLive(live.trim()); }
  };
  recog.onerror = (e) => {
    micErr = e.error;
    // not-allowed and service-not-allowed are fatal: restarting on them spins forever
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      recog = null; micLive = false;
      listenBtn.textContent = 'start listening'; listenBtn.classList.remove('on');
      stopLevels();
    }
  };
  recog.onend = () => {
    if (!recog) { micState = 'off'; micLive = false; return; }
    micState = 'restarting';
    try { recog.start(); } catch { /* already starting */ }
  };
  recog.start(); micLive = true;
  listenBtn.textContent='listening…'; listenBtn.classList.add('on');
});

// Approach reveals, click commits. Escape or losing focus puts it away again, so he
// goes back to being just a face the moment you are done.
const pill = document.getElementById('pill');
const floatPanel = document.getElementById('float');
document.getElementById('pillType').addEventListener('click', () => {
  document.body.classList.add('typing');
  document.getElementById('say').focus();
});
document.getElementById('pillMic').addEventListener('click', () => listenBtn.click());

// His own three. One is the backlight, which is the thing a button on a handheld
// has always been for and the answer to where it lives; the dial is the
// microphone; two is the screen he is. Each lights when its own thing is on, so
// the case is both the control and the readout — which is the whole point of a
// button that is moulded into something.
document.getElementById('key1').addEventListener('click', () => { lampOn = !lampOn; });
document.getElementById('key2').addEventListener('click', () => listenBtn.click());
document.getElementById('key3').addEventListener('click', () => { lcdMode = !lcdMode; });
document.getElementById('say').addEventListener('blur', () => {
  if (!document.getElementById('say').value.trim()) document.body.classList.remove('typing');
});
// The close button does what Escape does, for anyone who did not know Escape does it.
document.getElementById('sayclose').addEventListener('click', () => {
  const el = document.getElementById('say');
  el.value = '';
  document.body.classList.remove('typing');
  el.blur();
});

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { document.body.classList.remove('typing'); document.getElementById('say').blur(); }
});
// keep the pill's talk button in step with the listen state
new MutationObserver(() => {
  document.getElementById('pillMic').classList.toggle('on', listenBtn.classList.contains('on'));
}).observe(listenBtn, { attributes: true, attributeFilter: ['class'] });

// Type instead of talking. A visible box, because a hidden slash key opening a
// browser prompt() is not an answer to "where do I type".
const sayEl = document.getElementById('say');
// He reads what you are typing while you type it, the same way he reads a sentence
// you are still saying. No extra throttling needed: readLive already refuses to ask
// again inside 420ms or for text it has already seen, so holding a key down costs
// nothing and a burst of typing costs one read every couple of words.
//
// Reaction only — deliberately not routing. On speech the router runs against the
// interim transcript too, so an app is open before the sentence finishes; doing
// that to half-typed text would open things while you were still deciding what to
// ask for, and you can see the text you are typing, so there is nothing to gain.
sayEl.addEventListener('input', () => {
  const v = sayEl.value.trim();
  if (v.length > 5) readLive(v);
});

sayEl.addEventListener('keydown', (e) => {
  e.stopPropagation();
  if ((e.key === 'Enter' || e.keyCode === 13) && sayEl.value.trim()) {
    const v = sayEl.value.trim(); sayEl.value = '';
    setMood(M.heard); decide(v);
  }
});
addEventListener('keydown', (e) => {
  if (e.key === '/' && e.target.tagName !== 'INPUT') { e.preventDefault(); sayEl.focus(); }
});
// the panel sets user-select:none for dragging, which also kills text selection in
// the input unless it is exempted
sayEl.style.userSelect = 'text';

const nativePost = (type, extra = {}) => window.webkit.messageHandlers.mist.postMessage({type,...extra});
decide = async text => nativePost('text', {text});
readLive = async () => {};
routeLive = async () => {};
say = text => nativePost('speak', {text});
window.mistState = (state, text) => {
  micLive = state === 'listening'; talking = state === 'speaking';
  talkText = text || ''; talkAt = performance.now();
  document.body.classList.toggle('talking', talking);
  listenBtn.classList.toggle('on', micLive);
  setMood(state === 'error' ? M.lost : state === 'thinking' ? M.ask : micLive ? M.heard : M.idle);
  if (text) think(text, 'Rove · local');
};
document.addEventListener('click', e => {
  if (e.target.closest('#pillMic,#key2,#listen')) { e.preventDefault(); e.stopImmediatePropagation(); nativePost('toggle'); }
}, true);
document.addEventListener('keydown', e => { if(e.key === 'Escape') nativePost('stop'); },true);
let nativeDrag = null;
fc.addEventListener('pointerdown', e => { nativeDrag = {x:e.screenX,y:e.screenY}; fc.setPointerCapture(e.pointerId); nativePost('dragStart'); });
fc.addEventListener('pointermove', e => { if(nativeDrag) { nativePost('drag',{dx:e.screenX-nativeDrag.x,dy:e.screenY-nativeDrag.y}); nativeDrag={x:e.screenX,y:e.screenY}; }});
fc.addEventListener('pointerup', () => { nativeDrag=null; nativePost('dragEnd'); });
fc.addEventListener('pointercancel', () => { nativeDrag=null; nativePost('dragEnd'); });
nativePost('ready');
</script>
